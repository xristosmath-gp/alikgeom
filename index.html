<meta name="robots" content="noindex">
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ψηφιακό Βιβλίο Μαθηματικών</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; font-family: sans-serif; }

        /* ΣΤΑΘΕΡΗ ΜΠΑΡΑ ΠΛΟΗΓΗΣΗΣ */
        .nav-container {
            position: sticky;
            top: 0;
            background: #333;
            padding: 15px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        select {
            padding: 10px;
            font-size: 16px;
            width: 90%;
            max-width: 500px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* ΠΕΡΙΟΡΙΣΜΟΣ ΕΙΚΟΝΩΝ */
        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .page-img {
            width: 100%;
            max-width: 750px;
            height: auto;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: #fff;
        }

        .welcome-box {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        .welcome-box h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .welcome-box p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="nav-container">
    <select onchange="loadSection(this.value)">
        <option value="" disabled selected>-- Επιλέξτε Ενότητα --</option>
        
        <!-- Εισαγωγή -->
        <optgroup label="Γενικά">
            <option value="ID_0,1,8">Η Ταυτότητα του βιβλίου</option>
            <option value="ID_1,9,10">Τα Προσδοκώμενα Μαθησιακά Αποτελέσματα (ΠΜΑ)</option>
            <option value="ID_2,11,12">Δομή και οργάνωση του βιβλίου</option>
        </optgroup>

        <!-- ΚΕΦΑΛΑΙΟ 1 - Παράλληλες ευθειες -->
        <optgroup label="ΚΕΦΑΛΑΙΟ 1 - Παράλληλες ευθειες">
            <option value="K1_1,13,22">Ενότητα 1.1 – Ιδιότητες των παράλληλων ευθειών</option>
            <option value="K1_2,23,31">Ενότητα 1.2 – Άθροισμα γωνιών τριγώνου</option>
            <option value="K1_3,32,33">Ενότητα 1.3 – Ανακεφαλαίωση</option>
        </optgroup>

        <!-- ΚΕΦΑΛΑΙΟ 2 - Τρίγωνα και κύκλος -->
        <optgroup label="ΚΕΦΑΛΑΙΟ 2 - Τρίγωνα και κύκλος">
            <option value="K2_1,34,47">Ενότητα 2.1 – Ισότητα τριγώνων</option>
            <option value="K2_2,48,52">Ενότητα 2.2 – Ανισοτικές σχέσεις στα τρίγωνα</option>
            <option value="K2_3,53,55">Ενότητα 2.3 – Κύκλος – Χορδές – Αποστήματα</option>
            <option value="K2_4,56,65">Ενότητα 2.4 – Γεωμετρικές κατασκευές</option>
            <option value="K2_5,66,68">Ενότητα 2.5 – Γεωμετρικοί τόποι</option>
            <option value="K2_6,69,72">Ενότητα 2.6 – Ανακεφαλαίωση</option>
        </optgroup>

        <!-- ΚΕΦΑΛΑΙΟ 3 - Παραλληλόγραμμα -->
        <optgroup label="ΚΕΦΑΛΑΙΟ 3 - Παραλληλόγραμμα">
            <option value="K3_1,73,81">Ενότητα 3.1 – Το παραλληλόγραμμο</option>
            <option value="K3_2,82,91">Ενότητα 3.2 – Είδη παραλληλογράμμων</option>
            <option value="K3_3,92,95">Ενότητα 3.3 – Τμήμα που ενώνει τα μέσα δύο πλευρών τριγώνου</option>
            <option value="K3_4,96,101">Ενότητα 3.4 – Ιδιότητες των ορθογωνίων τριγώνων</option>
            <option value="K3_5,102,108">Ενότητα 3.5 – Χαρακτηριστικά σημεία τριγώνου</option>
            <option value="K3_6,109,115">Ενότητα 3.6 – Τραπέζια</option>
            <option value="K3_7,116,121">Ενότητα 3.7 – Ανακεφαλαίωση</option>
        </optgroup>

        <!-- ΚΕΦΑΛΑΙΟ 4 - Στερεομετρία -->
        <optgroup label="ΚΕΦΑΛΑΙΟ 4 - Στερεομετρία">
            <option value="K4_1,122,130">Ενότητα 4.1 – Ευθειες και επίπεδα στον χώρο</option>
            <option value="K4_2,131,133">Ενότητα 4.2 – Δίεδρες γωνίες – Κάθετα επίπεδα</option>
            <option value="K4_3,134,135">Ενότητα 4.3 – Ανακεφαλαίωση</option>
        </optgroup>

        <!-- Παράρτημα -->
        <optgroup label="ΠΑΡΑΡΤΗΜΑ">
            <option value="PAR1,136,143">Υποδείξεις - Απαντήσεις ασκήσεων</option>
            <option value="PAR2,144,144">Ευρετήριο</option>
        </optgroup>
    </select>
</div>

    <main id="content" class="content-area">
        <div class="welcome-box" id="welcomeBox">
            <h1>Καλώς ήρθατε στη ΓΕΩΜΕΤΡΙΑ Α΄ Λυκείου</h1>
            <p>Επιλέξτε μια ενότητα από το μενού πάνω για να δείτε το περιεχόμενο.</p>
        </div>
    </main>

    <script>
        function loadSection(value) {
            if (!value) return;
            const parts = value.split(',');
            const folder = parts[0];
            const start = parseInt(parts[1]);
            const end = parseInt(parts[2]);
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = ''; 

            for(let i = start; i <= end; i++) {
                let img = document.createElement('img');
                img.src = `images/${folder}/Mathematics-Geometria_A-lykeiou_vivliomathiti_web-pdf_v1.0-${i}.webp`;
                img.className = 'page-img';
                
                // ΕΛΕΓΧΟΣ: Αν η εικόνα δεν υπάρχει στον φάκελο, διαγράφεται αυτόματα από τη σελίδα
                img.onerror = function() {
                    this.remove();
                };

                contentDiv.appendChild(img);
            }
            window.scrollTo(0, 0);
        }
    </script>
